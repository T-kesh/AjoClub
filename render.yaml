services:
  - type: web
    name: ajoclub-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run bot
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BASE_CHAIN_ID
        value: "84532"
      - key: BASE_SEPOLIA_RPC_URL
        value: https://sepolia.base.org
      - key: AJO_CLUB_CONTRACT_ADDRESS
        value: 0xaD5a169267f0FA9F1D59716F10973B6450853B95
      - key: USDC_TOKEN_ADDRESS
        value: 0x036CbD53842c5426634e7929541eC2318f3dCF7e
      - key: DATABASE_PATH
        value: ./db/ajo.db
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BASE_SEPOLIA_AGENT_KEY
        sync: false
